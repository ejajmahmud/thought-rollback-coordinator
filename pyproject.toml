[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thought-rollback-coordinator"
version = "0.1.0"
description = "Transactional undo/redo engine for agent scratchpads that automatically reverts tool side-effects upon detecting faulty intermediate logic"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
thought-rollback-coordinator = "thought_rollback_coordinator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["thought_rollback_coordinator*"]
